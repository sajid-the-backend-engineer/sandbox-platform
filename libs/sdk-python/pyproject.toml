[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "northrays"
version = "0.0.0-dev"
authors = [
    { name = "Northrays", email = "support@northrays.com"  },
]
description = "Python SDK for Northrays"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    # The generated API clients this package imports at runtime. They are
    # built from the same OpenAPI spec in the same release, so the publish
    # workflow (scripts/set-python-package-version.py) rewrites these four
    # lines to "==<version>" before building. The floor is 0.0.0.dev0 rather
    # than 0.0.0 on purpose: a checkout installed from git carries version
    # 0.0.0-dev, which PEP 440 orders BEFORE 0.0.0, so ">=0.0.0" would reject
    # the very clients installed next to it.
    "northrays-api-client>=0.0.0.dev0",
    "northrays-api-client-async>=0.0.0.dev0",
    "northrays-toolbox-api-client>=0.0.0.dev0",
    "northrays-toolbox-api-client-async>=0.0.0.dev0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.4.2,<3.0.0",
    "Deprecated>=1.2.18,<2.0.0",
    "httpx>=0.28.0,<0.29.0",
    "httpx-ws>=0.7.0,<1.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "wsproto>=1.2.0,<2.0.0",
    "aiofiles>=24.1.0,<24.2.0",
    "toml>=0.10.0,<0.11.0",
    "obstore>=0.8.0,<0.9.0",
    "python-multipart>=0.0.15,<0.1.0",
    "typing-extensions>=4.0.0; python_version < '3.10'",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.59b0",
    "urllib3>=2.1.0,<3.0.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["northrays", "sdk"]
license = {text = "Apache-2.0"}

[tool.deptry]
exclude = ["scripts", "tests"]
extend_exclude = [".venv", "dist", "build", ".pytest_cache", "__pycache__"]
