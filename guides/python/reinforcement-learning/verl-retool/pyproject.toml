[project]
name = "northrays-verl-retool"
version = "0.1.0"
description = "Companion files for benchmarking veRL ReTool backends with Northrays"
authors = [{name = "Northrays Team", email = "support@northrays.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "northrays>=0.128.1,<1.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
