[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northrays-sglang-serving"
version = "0.1.0"
description = "Serve an OpenAI-compatible SGLang endpoint on a Northrays GPU sandbox"
authors = [
    {name = "Lovre Pesut", email = "lpesut@northrays.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "northrays>=0.185.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "openai>=1.60.0",
    "litellm>=1.70.0",
]

[tool.setuptools]
py-modules = []
