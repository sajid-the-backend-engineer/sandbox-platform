# Build-only validation of the service images on pull requests.
# Nothing is pushed to any registry here — the goal is purely to catch a
# Dockerfile / build-context regression before it reaches main, where
# deploy.yaml will build the same images for real and push them to ECR.

name: Docker build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  VERSION: v0.0.0-pr

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free up disk space
        # ubuntu-latest ships ~25 GB free; the Go + Node build stages plus the
        # buildx cache overrun that. Dropping the preinstalled Android/.NET/
        # Haskell toolchains buys back ~20 GB.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-python: 'false'
          install-ruby: 'false'
          install-java: 'false'
          install-poetry: 'false'
          install-swag: 'false'
          run-poetry-install: 'false'

      - name: Ensure go.work.sum exists
        # The composite runs `go work sync`, but when sync has nothing to write
        # the file is never created — and the Go Dockerfiles do
        # `COPY go.work go.work.sum`, which then fails.
        run: touch go.work.sum

      - name: Set up Docker Buildx
        # Replaces the Blacksmith builder from the upstream pipeline. The
        # docker-container driver is required by the `pr-build` configuration
        # (explicit `platforms` + `type=gha` cache).
        uses: docker/setup-buildx-action@v3

      - name: Build all Docker targets
        # sandbox, sandbox-slim and sandbox-gpu excluded: sandbox/sandbox-slim's
        # base mcr.microsoft.com/devcontainers/python is anonymous-pulled from
        # GHA runners and flakes with 403 Forbidden; sandbox-gpu builds FROM the
        # sandbox image (large, GPU oriented, amd64-only).
        run: |
          yarn nx run-many \
            --target=docker \
            --configuration=pr-build \
            --exclude=sandbox,sandbox-slim,sandbox-gpu \
            --parallel=2 \
            --nxBail=true
